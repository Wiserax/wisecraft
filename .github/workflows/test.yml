name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # ffmpeg is for the loudness, duplicate-frame and small EDL tests. Without recommends apt skips about half the
      # download. When the mirror crawls, the step gives up after 8 minutes and the run goes on: those tests skip
      # without ffmpeg instead of failing the build.
      - name: ffmpeg
        timeout-minutes: 8
        continue-on-error: true
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv run --with pytest pytest -q tests
      - run: ./bin/wise --help && for g in scan qa board loudness dupframes video kb publish; do ./bin/wise $g --help > /dev/null; done
      - name: skill copies
        run: python3 scripts/sync_skills.py --check
      - name: knowledge base
        run: ./bin/wise kb check --index
      - name: nothing that shouldn't ship
        run: ./bin/wise publish check .
