[project]
name = "wisecraft"
version = "0.3.0"
description = "Tools for AI agents that make a game's trailer, test it with virtual players in a real phone browser, and tune its balance and economy: an EDL trailer compiler and a check of the finished file, persona bots in muted Chromium and WebKit, loudness measured and fixed without playing a sound, design boards."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "numpy>=1.24",
]

[project.scripts]
wise = "wisecraft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wisecraft"]
