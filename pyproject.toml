[project]
name = "wisecraft"
version = "0.2.0"
description = "Tools and a shared knowledge base for AI agents that build, balance, polish and ship games: a scanner for any game project or video, muted phone-browser QA for web games, design boards, loudness measured and fixed, an EDL trailer compiler, field notes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "numpy>=1.24",
]

[project.scripts]
wise = "wisecraft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wisecraft"]
