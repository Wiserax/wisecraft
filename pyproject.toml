[project]
name = "wizerax"
version = "0.2.0"
description = "Tools and a shared knowledge base for AI agents that build, balance, polish and ship mobile web games: stack scanner, muted phone-browser QA, design boards, loudness and slow-motion checks, EDL trailer compiler, pre-release lint, field notes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "numpy>=1.24",
    "pyyaml>=6",
]

[project.scripts]
wz = "wz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wz"]
